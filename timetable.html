<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timetable | School Management Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <link href="css/timetable.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebarMount"></div>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="page-kicker">Weekly Planning</p>
            <h1 class="page-title">Timetable</h1>
            <p class="page-subtitle">
              Build weekly schedules by day and period while preventing teacher
              double-booking.
            </p>
          </div>
          <button
            class="btn btn-ghost mobile-menu-btn"
            type="button"
            data-toggle-sidebar
          >
            <i class="bi bi-list"></i>
            Menu
          </button>
        </header>

        <section class="timetable-page">
          <section class="form-panel">
            <div
              class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-3"
            >
              <div>
                <h2 class="section-title" id="timetableFormTitle">
                  Add Timetable Entry
                </h2>
                <p class="section-subtitle">
                  Assign subject, teacher, class, section, day, and period.
                </p>
              </div>
              <button
                class="btn btn-ghost"
                type="button"
                id="resetTimetableFormBtn"
              >
                <i class="bi bi-arrow-counterclockwise"></i>
                Reset
              </button>
            </div>

            <form id="timetableForm">
              <input type="hidden" id="timetableId" />

              <div class="form-grid">
                <div>
                  <label class="form-label" for="classGrade">Class</label>
                  <select class="form-select" id="classGrade" required></select>
                </div>

                <div>
                  <label class="form-label" for="section">Section</label>
                  <select class="form-select" id="section" required></select>
                </div>

                <div>
                  <label class="form-label" for="day">Day</label>
                  <select class="form-select" id="day" required></select>
                </div>

                <div>
                  <label class="form-label" for="period">Period</label>
                  <select class="form-select" id="period" required></select>
                </div>

                <div>
                  <label class="form-label" for="subject">Subject</label>
                  <input
                    class="form-control"
                    id="subject"
                    required
                    placeholder="Mathematics"
                  />
                </div>

                <div>
                  <label class="form-label" for="teacherId">Teacher</label>
                  <select class="form-select" id="teacherId" required></select>
                </div>
              </div>

              <div class="action-row mt-3">
                <button class="btn btn-primary" type="submit">
                  <i class="bi bi-save-fill"></i>
                  Save Entry
                </button>
              </div>
            </form>
          </section>

          <section class="table-panel">
            <div
              class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-3"
            >
              <div>
                <h2 class="section-title">Weekly Grid</h2>
                <p class="section-subtitle">
                  Filter by class or teacher to inspect weekly schedules.
                </p>
              </div>
              <span
                class="timetable-filter-note"
                id="timetableFilterNote"
              ></span>
            </div>

            <div class="filter-grid mb-3">
              <div>
                <label class="form-label" for="filterClass"
                  >Class / Section</label
                >
                <select class="form-select" id="filterClass"></select>
              </div>

              <div>
                <label class="form-label" for="filterTeacher">Teacher</label>
                <select class="form-select" id="filterTeacher"></select>
              </div>

              <div>
                <label class="form-label" for="filterSubject">Subject</label>
                <input
                  class="form-control"
                  id="filterSubject"
                  placeholder="Search subject..."
                />
              </div>

              <div class="d-flex align-items-end">
                <button
                  class="btn btn-ghost w-100"
                  type="button"
                  id="clearTimetableFiltersBtn"
                >
                  <i class="bi bi-x-circle"></i>
                  Clear Filters
                </button>
              </div>
            </div>

            <div class="timetable-grid-wrap" id="timetableGridMount"></div>
          </section>
        </section>
      </main>
    </div>

    <div class="status-area" id="statusArea"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/timetable.js"></script>
  </body>
</html>
