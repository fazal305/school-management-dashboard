<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance | School Management Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <meta name="description" content="A browser-based school management dashboard with students, teachers, attendance, timetable, grades, fee tracking, dashboard analytics, dark mode, and localStorage persistence." />
    <link rel="canonical" href="https://fazal305.github.io/school-management-dashboard/attendance.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/school-management-dashboard/attendance.html" />
    <meta property="og:title" content="Attendance | School Management Dashboard" />
    <meta property="og:description" content="A browser-based school management dashboard with students, teachers, attendance, timetable, grades, fee tracking, dashboard analytics, dark mode, and localStorage persistence." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Attendance | School Management Dashboard" />
    <meta name="twitter:description" content="A browser-based school management dashboard with students, teachers, attendance, timetable, grades, fee tracking, dashboard analytics, dark mode, and localStorage persistence." />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <link href="css/attendance.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebarMount"></div>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="page-kicker">Daily Register</p>
            <h1 class="page-title">Attendance</h1>
            <p class="page-subtitle">
              Mark daily attendance, prevent duplicates, and review records by
              date, class, student, or status.
            </p>
          </div>
          <button
            class="btn btn-ghost mobile-menu-btn"
            type="button"
            data-toggle-sidebar
          >
            <i class="bi bi-list"></i>
            Menu
          </button>
        </header>

        <section class="attendance-board">
          <div class="attendance-summary" id="attendanceStats"></div>

          <section class="form-panel">
            <div
              class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-3"
            >
              <div>
                <h2 class="section-title">Mark Attendance</h2>
                <p class="section-subtitle">
                  Choose date, class, and section before marking each student.
                </p>
              </div>
              <button
                class="btn btn-primary"
                type="button"
                id="saveAttendanceBtn"
              >
                <i class="bi bi-save-fill"></i>
                Save Attendance
              </button>
            </div>

            <div class="filter-grid mb-3">
              <div>
                <label class="form-label" for="markDate">Date</label>
                <input class="form-control" id="markDate" type="date" />
              </div>

              <div>
                <label class="form-label" for="markClass">Class</label>
                <select class="form-select" id="markClass"></select>
              </div>

              <div>
                <label class="form-label" for="markSection">Section</label>
                <select class="form-select" id="markSection"></select>
              </div>

              <div>
                <label class="form-label" for="markNotes">Notes</label>
                <input
                  class="form-control"
                  id="markNotes"
                  placeholder="Optional notes"
                />
              </div>
            </div>

            <div class="attendance-mark-grid" id="attendanceMarkMount"></div>
          </section>

          <section class="table-panel">
            <h2 class="section-title">Attendance Records</h2>
            <p class="section-subtitle">
              Search and filter historical attendance records.
            </p>

            <div class="filter-grid mb-3">
              <div>
                <label class="form-label" for="attendanceSearch">Search</label>
                <input
                  class="form-control"
                  id="attendanceSearch"
                  placeholder="Search student, class, notes..."
                />
              </div>

              <div>
                <label class="form-label" for="filterDate">Date</label>
                <input class="form-control" id="filterDate" type="date" />
              </div>

              <div>
                <label class="form-label" for="filterClass">Class</label>
                <select class="form-select" id="filterClass"></select>
              </div>

              <div>
                <label class="form-label" for="filterStatus">Status</label>
                <select class="form-select" id="filterStatus">
                  <option value="">All statuses</option>
                  <option>Present</option>
                  <option>Absent</option>
                  <option>Late</option>
                  <option>Leave</option>
                </select>
              </div>
            </div>

            <div id="attendanceTableMount"></div>
          </section>
        </section>
      </main>
    </div>

    <div class="status-area" id="statusArea"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/attendance.js"></script>
  </body>
</html>
